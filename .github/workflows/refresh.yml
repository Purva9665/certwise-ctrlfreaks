# CertWise - refresh live facts automatically once a month (and on demand from the Actions tab).
# Needs one repository secret (Settings -> Secrets and variables -> Actions):
#   GEMINI_API_KEY     free key from Google AI Studio - re-reads our listed sources
name: Monthly data refresh

on:
  schedule:
    - cron: "30 3 1 * *"     # 03:30 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      ids:
        description: "Only these roles/certificates, comma-separated (e.g. data,aws-ccp). Leave empty for all."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Refresh and fact-check
        run: |
          if [ -n "$IDS" ]; then npm run refresh -- --ids "$IDS"; else npm run refresh; fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IDS: ${{ github.event.inputs.ids }}
      - name: Save verified facts
        run: |
          git config user.name "certwise-bot"
          git config user.email "certwise-bot@users.noreply.github.com"
          git add data/live.js refresh/report.json
          git diff --cached --quiet || git commit -m "Monthly refresh of verified facts"
          git push
